{% extends "base.html" %}

{% block title %}Register Organization - EcoPlate AI{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-8 col-lg-6">
        <div class="card eco-card border-0 shadow-lg my-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-light text-success mb-3">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold">Register Organization</h3>
                    <p class="text-muted small">Join the institutional food waste reduction and redistribution network</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="e.g. cafeteria_admin" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="admin@organization.edu" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Ecosystem Role</label>
                            <select name="role" class="form-select" required>
                                <option value="kitchen_manager">Institutional Kitchen / Mess / Processor</option>
                                <option value="ngo">NGO / Relief Organization / Community Kitchen</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold">Organization / Kitchen Name</label>
                            <input type="text" name="organization_name" class="form-control" placeholder="e.g. Apex Central Mess or Robin Hood Army Chapter" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Contact Phone</label>
                            <input type="tel" name="contact_phone" class="form-control" placeholder="+91 98765 43210" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Physical Location / Address</label>
                            <input type="text" name="address" class="form-control" placeholder="Campus Dining Hall, Sector 12" required>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-ecogreen w-100 py-2">
                                <i class="bi bi-check-circle me-1"></i> Complete Registration
                            </button>
                        </div>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="text-success fw-semibold">Log in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
