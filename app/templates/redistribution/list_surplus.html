{% extends "base.html" %}

{% block title %}Broadcast Surplus Food - EcoPlate AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card eco-card shadow-sm border-0">
            <div class="card-header card-header-clean bg-light d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="fw-bold mb-0"><i class="bi bi-broadcast text-success me-2"></i> Broadcast Unserved Surplus Food</h5>
                    <small class="text-muted">Instant alert to verified local NGOs, shelters & community redistribution networks</small>
                </div>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('donation.list_surplus') }}">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label small fw-semibold">Food Name / Description</label>
                            <input type="text" name="food_name" class="form-control" placeholder="e.g. Steamed Rice, Dal Makhani & Phulkas" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Dietary Classification</label>
                            <select name="dietary_type" class="form-select" required>
                                <option value="Vegetarian" selected>Vegetarian (Veg)</option>
                                <option value="Non-Vegetarian">Non-Vegetarian</option>
                                <option value="Vegan">Vegan</option>
                                <option value="Bakery">Bakery / Confectionery</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Available Portions (Number of People)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-people-fill text-muted"></i></span>
                                <input type="number" name="quantity_portions" class="form-control" min="5" max="5000" placeholder="e.g. 60" required>
                                <span class="input-group-text">meals</span>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Approximate Total Weight</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-box-fill text-muted"></i></span>
                                <input type="number" step="0.5" name="weight_approx_kg" class="form-control" placeholder="e.g. 25" required>
                                <span class="input-group-text">kg</span>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Safe Consumption Window (Hours from now)</label>
                            <select name="safe_hours" class="form-select" required>
                                <option value="2.0">Critical: 2 Hours (Requires urgent pickup)</option>
                                <option value="3.5">Urgent: 3.5 Hours</option>
                                <option value="5.0" selected>Standard: 5 Hours</option>
                                <option value="8.0">Extended Cold Chain: 8 Hours</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Holding Storage Temperature</label>
                            <select name="storage_temp" class="form-select">
                                <option value="Hot (>60°C)" selected>Hot Holding (>60°C)</option>
                                <option value="Chilled (<5°C)">Chilled Refrigerated (&lt;5°C)</option>
                                <option value="Ambient Room Temp">Ambient Room Temperature</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Packaging Type</label>
                            <input type="text" name="packaging_type" class="form-control" value="Insulated Food-Grade Containers" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Dispatch Contact Phone</label>
                            <input type="tel" name="contact_phone" class="form-control" value="{{ current_user.contact_phone or '+91 98765 43210' }}" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold">Pickup Location & Gate Instructions</label>
                            <input type="text" name="pickup_address" class="form-control" value="{{ current_user.address or 'Campus Kitchen Loading Bay, Gate 3' }}" required>
                        </div>

                        <!-- FSSAI Food Safety Declaration -->
                        <div class="col-12">
                            <div class="p-3 bg-light rounded-3 border">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="fssai_verified" id="fssai_check" checked required>
                                    <label class="form-check-label small" for="fssai_check">
                                        <strong>Food Safety Declaration:</strong> I confirm this food is unserved, prepared in hygienic premises compliant with FSSAI/basic food safety standards, and stored safely for redistribution.
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 mt-4 pt-2 border-top d-flex justify-content-end">
                            <button type="submit" class="btn btn-ecogreen px-4 py-2">
                                <i class="bi bi-broadcast me-1"></i> Publish Surplus Broadcast
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
